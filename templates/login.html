{% extends "layout.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card auth-card bg-dark border border-warning text-white p-4 shadow">
            <h2 class="text-warning text-center mb-4">Login</h2>
            <form method="post" action="{{ url_for('login') }}">
                {% if error %}
                    <div class="alert alert-danger login-error" role="alert">{{ error }}</div>
                {% endif %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control bg-secondary text-white border-0{% if login_failed|default(false) %} is-invalid login-field-error{% endif %}" id="username" name="username" value="{{ username|default('') }}" aria-invalid="{{ 'true' if login_failed|default(false) else 'false' }}" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control bg-secondary text-white border-0{% if login_failed|default(false) %} is-invalid login-field-error{% endif %}" id="password" name="password" aria-invalid="{{ 'true' if login_failed|default(false) else 'false' }}" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">Log In</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Don't have an account?
                <a href="{{ url_for('register') }}" class="text-warning text-decoration-none">Register</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
