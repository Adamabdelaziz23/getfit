{% extends "layout.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card bg-dark border border-warning text-white p-4 shadow">
            <h2 class="text-warning text-center mb-4">Login</h2>
            <form method="post" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control bg-secondary text-white border-0" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control bg-secondary text-white border-0" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">Log In</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Don't have an account?
                <a href="{{ url_for('register') }}" class="text-warning text-decoration-none">Register</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
